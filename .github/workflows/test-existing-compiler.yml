
name: Test Existing Kotlin Compiler

on:
  workflow_dispatch:

jobs:
  test-compiler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # Download the EXACT compiler JAR from the known-good build.
      # This workflow does NOT rebuild the compiler.
      # ------------------------------------------------------------
      - name: Download existing kotlinc.jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf compiler
          mkdir -p compiler

          gh run download 33629574659 \
            --repo "${{ github.repository }}" \
            --name kotlinc-46142fa002173315e47cf6aa9b399802202b8ae1 \
            --dir compiler

          echo "Artifact contents:"
          find compiler -maxdepth 2 -type f -print

          test -s compiler/kotlinc.jar

          echo
          echo "Existing compiler JAR:"
          ls -lh compiler/kotlinc.jar

      # ------------------------------------------------------------
      # Resolve dependencies using a REAL temporary Gradle project.
      #
      # This avoids the previous -I init-script problem.
      #
      # The dependency declarations mirror the current :kotlinc
      # module:
      #
      #   org.jetbrains.kotlin:kotlin-compiler:2.4.10
      #   org.jetbrains.intellij.deps:trove4j:1.0.20200330
      #
      # Gradle resolves ALL transitive dependencies automatically.
      # ------------------------------------------------------------
      - name: Resolve compiler dependencies automatically
        run: |
          rm -rf dependency-resolver
          mkdir -p dependency-resolver
          mkdir -p compiler/lib

          cat > dependency-resolver/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  mavenCentral()
                  gradlePluginPortal()
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  mavenCentral()
          }

          rootProject.name = "compiler-dependency-resolver"
          EOF

          cat > dependency-resolver/build.gradle <<'EOF'
          plugins {
              id 'base'
          }

          repositories {
              mavenCentral()
          }

          configurations {
              compilerRuntime
          }

          dependencies {
              compilerRuntime 'org.jetbrains.kotlin:kotlin-compiler:2.4.10'
              compilerRuntime 'org.jetbrains.intellij.deps:trove4j:1.0.20200330'
          }

          tasks.register('resolveCompilerRuntime') {
              doLast {
                  def outputDir = file("${rootProject.projectDir}/../compiler/lib")
                  outputDir.mkdirs()

                  configurations.compilerRuntime.resolve().each { file ->
                      copy {
                          from file
                          into outputDir
                      }

                      println "RESOLVED: ${file.name}"
                  }
              }
          }
          EOF

          cd dependency-resolver

          ../gradlew \
            resolveCompilerRuntime \
            --no-daemon \
            --stacktrace

      - name: Show automatically resolved dependencies
        run: |
          echo "=========================================="
          echo "Automatically resolved compiler dependencies"
          echo "=========================================="

          find compiler/lib \
            -type f \
            -name "*.jar" \
            -print | sort

          echo
          echo "Dependency count:"
          find compiler/lib \
            -type f \
            -name "*.jar" | wc -l

      # ------------------------------------------------------------
      # Build the runtime classpath from EVERYTHING Gradle resolved.
      # No individual dependency is guessed or hardcoded here.
      # ------------------------------------------------------------
      - name: Build compiler classpath
        run: |
          COMPILER_CP="compiler/kotlinc.jar"

          while IFS= read -r jar; do
              COMPILER_CP="$COMPILER_CP:$jar"
          done < <(
              find compiler/lib \
                -type f \
                -name "*.jar" \
                | sort
          )

          echo "COMPILER_CP=$COMPILER_CP" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Compiler classpath"
          echo "=========================================="

          echo "$COMPILER_CP" | tr ':' '\n'

      # ------------------------------------------------------------
      # Verify the EXISTING JAR can actually start.
      # ------------------------------------------------------------
      - name: Check compiler version
        run: |
          echo "Starting existing Kotlin compiler..."

          java -cp "$COMPILER_CP" \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -version

      # ------------------------------------------------------------
      # Real Kotlin compilation test.
      # ------------------------------------------------------------
      - name: Create Kotlin test source
        run: |
          mkdir -p test-src test-out

          cat > test-src/Main.kt <<'EOF'
          import java.math.BigInteger

          data class User(
              val name: String,
              val age: Int
          )

          fun main() {
              val a = "123456789"
              val b = "987654321"

              val x: BigInteger = a.toBigInteger()
              val y: BigInteger = b.toBigInteger()

              val result = x + y

              val user = User("Riad", 18)

              val numbers = listOf(1, 2, 3, 4, 5)
              val doubled = numbers.map { it * 2 }

              println("BigInteger result: $result")
              println("User: $user")
              println("Doubled: $doubled")
          }
          EOF

          echo "Test source:"
          cat test-src/Main.kt

      - name: Compile Kotlin test
        run: |
          java -cp "$COMPILER_CP" \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -classpath "$COMPILER_CP" \
            -d test-out \
            test-src/Main.kt

          test -s test-out/MainKt.class

          echo
          echo "Kotlin compilation successful."

          echo
          echo "Generated class files:"
          find test-out -type f -print

      # ------------------------------------------------------------
      # Execute the generated JVM bytecode.
      # ------------------------------------------------------------
      - name: Run compiled Kotlin program
        run: |
          RUNTIME_CP="test-out"

          while IFS= read -r jar; do
              RUNTIME_CP="$RUNTIME_CP:$jar"
          done < <(
              find compiler/lib \
                -type f \
                -name "*.jar" \
                | sort
          )

          echo "Running compiled Kotlin program..."

          java -cp "$RUNTIME_CP" MainKt

      # ------------------------------------------------------------
      # Java interoperability test.
      # ------------------------------------------------------------
      - name: Test Java interoperability
        run: |
          cat > test-src/JavaInterop.java <<'EOF'
          public class JavaInterop {
              public static String message() {
                  return "Hello from Java";
              }
          }
          EOF

          javac \
            -d test-out \
            test-src/JavaInterop.java

          cat > test-src/Interop.kt <<'EOF'
          fun main() {
              println(JavaInterop.message())
          }
          EOF

          java -cp "$COMPILER_CP" \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -classpath "$COMPILER_CP:test-out" \
            -d test-out \
            test-src/Interop.kt

          test -s test-out/InteropKt.class

          RUNTIME_CP="test-out"

          while IFS= read -r jar; do
              RUNTIME_CP="$RUNTIME_CP:$jar"
          done < <(
              find compiler/lib \
                -type f \
                -name "*.jar" \
                | sort
          )

          java -cp "$RUNTIME_CP" InteropKt

      # ------------------------------------------------------------
      # Verify generated JVM bytecode.
      # ------------------------------------------------------------
      - name: Verify generated bytecode
        run: |
          test -s test-out/MainKt.class
          test -s test-out/InteropKt.class

          echo "=========================================="
          echo "MainKt bytecode"
          echo "=========================================="

          javap \
            -classpath test-out \
            MainKt

          echo
          echo "=========================================="
          echo "InteropKt bytecode"
          echo "=========================================="

          javap \
            -classpath test-out \
            InteropKt

      # ------------------------------------------------------------
      # Final result.
      # ------------------------------------------------------------
      - name: Final result
        run: |
          echo
          echo "=========================================="
          echo " EXISTING KOTLIN COMPILER TEST PASSED"
          echo "=========================================="
          echo
          echo "Existing kotlinc.jar:          OK"
          echo "Artifact download:             OK"
          echo "Automatic dependency resolve:  OK"
          echo "Compiler startup:              OK"
          echo "Kotlin compilation:            OK"
          echo "BigInteger test:               OK"
          echo "Collections/lambda test:       OK"
          echo "JVM execution:                 OK"
          echo "Java interoperability:         OK"
          echo "Bytecode generation:            OK"
          echo
          echo "The existing compiler JAR passed"
          echo "the JVM compiler verification."
          echo "=========================================="
