name: Test Existing Kotlin Compiler

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download compiler artifact from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p compiler
          gh run download 33629574659 -R shakinkhan943-source/kotlinc-for-sketchware -n kotlinc-46142fa002173315e47cf6aa9b399802202b8ae1 -D compiler
          test -s compiler/kotlinc.jar
          ls -lh compiler/kotlinc.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Kotlin runtime required by compiler
        run: |
          set -e
          mkdir -p compiler/lib
          curl -fsSL -o compiler/lib/kotlin-stdlib.jar \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/2.4.10/kotlin-stdlib-2.4.10.jar
          test -s compiler/lib/kotlin-stdlib.jar
          ls -lh compiler/lib/kotlin-stdlib.jar

      - name: Test compiler startup
        run: |
          set -e
          java -cp "compiler/kotlinc.jar:compiler/lib/kotlin-stdlib.jar" \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler -version

      - name: Create Kotlin test suite
        run: |
          mkdir -p tests/out
          cat > tests/Basic.kt <<'EOF'
          import java.math.BigInteger

          fun main() {
              val a = "123456789"
              val b = "987654321"
              val x: BigInteger = a.toBigInteger()
              val y: BigInteger = b.toBigInteger()
              check(x + y == BigInteger("1111111110"))
              println("BASIC_OK")
          }
          EOF

          cat > tests/Features.kt <<'EOF'
          data class User(val name: String, val age: Int)

          fun testFeatures(): String {
              val users = listOf(User("Riad", 18), User("Test", 20))
              val result = users.filter { it.age >= 18 }.map { it.name }.joinToString()
              return result
          }
          EOF

      - name: Compile Kotlin tests with existing compiler
        run: |
          set -e
          java -cp "compiler/kotlinc.jar:compiler/lib/kotlin-stdlib.jar" \
            org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \
            -d tests/out \
            tests/Basic.kt tests/Features.kt
          test -s tests/out/BasicKt.class
          test -s tests/out/FeaturesKt.class
          echo "KOTLIN_COMPILE_OK"

      - name: Run JVM output
        run: |
          set -e
          java -cp "tests/out:compiler/lib/kotlin-stdlib.jar:compiler/kotlinc.jar" BasicKt

      - name: Verify generated bytecode
        run: |
          set -e
          javap -verbose tests/out/BasicKt.class >/dev/null
          javap -verbose tests/out/FeaturesKt.class >/dev/null
          echo "BYTECODE_OK"
