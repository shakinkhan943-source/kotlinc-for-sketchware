name: Kotlin Android Compiler CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - kotlin-2.4.10-android-modernization
  pull_request:
    branches:
      - master

concurrency:
  group: kotlinc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin compiler jar
        run: ./gradlew --no-daemon --stacktrace :kotlinc:shadowJar

      - name: Verify artifact
        run: |
          set -e
          ARTIFACT=build/libs/kotlinc.jar
          test -s "$ARTIFACT"
          ls -lh "$ARTIFACT"

          # Collect the entry list once for the checks below.
          jar tf "$ARTIFACT" > /tmp/entries.txt

          # Core Kotlin 2.4.10/K2 compiler entry point is present.
          grep -q '^org/jetbrains/kotlin/cli/jvm/K2JVMCompiler\.class$' /tmp/entries.txt

          # IntelliJ platform is relocated under the Kotlin namespace (avoids clashing with
          # Sketchware's own bundled IntelliJ classes on Android): the relocated class exists and
          # the unrelocated platform package is absent.
          grep -q '^org/jetbrains/kotlin/com/intellij/openapi/vfs/VirtualFile\.class$' /tmp/entries.txt
          ! grep -q '^com/intellij/' /tmp/entries.txt

          # Android-specific compiler patches are bundled, including the 2.4.10 chunked jar FS
          # (LargeDynamicMappedBuffer) which avoids whole-jar memory maps on low-end devices.
          for cls in \
            'org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarFileSystem.class' \
            'org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarHandler.class' \
            'org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarVirtualFile.class' \
            'org/jetbrains/kotlin/cli/jvm/compiler/jarfs/LargeDynamicMappedBuffer.class' \
            'org/jetbrains/kotlin/cli/jvm/compiler/jarfs/ZipEntryDescription.class' \
            'org/jetbrains/kotlin/cli/jvm/config/JvmContentRootsKt.class' \
            'org/jetbrains/kotlin/util/ServiceLoaderLite.class' \
            'org/jetbrains/kotlin/utils/PathUtil.class' \
            'org/jetbrains/kotlin/reflection/android/AndroidSupport.class' ; do
            grep -q "^$cls$" /tmp/entries.txt || { echo "Missing expected class: $cls"; exit 1; }
          done

      - name: Verify remapped classes wire the Android/2.4.10 hooks
        # Class files must be valid (frames preserved, not recomputed against an incomplete classpath)
        # and still reference the hooks the Android port relies on. 'jar' ships with the JDK, so no
        # extra packages are needed.
        run: |
          set -e
          ARTIFACT="$GITHUB_WORKSPACE/build/libs/kotlinc.jar"
          TMP=$(mktemp -d)
          cd "$TMP"
          jar xf "$ARTIFACT" \
            org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarVirtualFile.class \
            org/jetbrains/kotlin/util/ServiceLoaderLite.class \
            org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarFileSystem.class

          # Class files must parse (valid bytecode / stack-map frames after relocation).
          javap -p -c org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarVirtualFile.class >/dev/null
          javap -p    org/jetbrains/kotlin/util/ServiceLoaderLite.class >/dev/null
          javap -p    org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarFileSystem.class >/dev/null

          # FastJar virtual file implements the 2.4.10 LibraryContainerAwareVirtualFile hook used by K2.
          grep -aq 'LibraryContainerAwareVirtualFile' org/jetbrains/kotlin/cli/jvm/compiler/jarfs/FastJarVirtualFile.class
          # The Dalvik-aware service loader references dalvik.system.PathClassLoader.
          grep -aq 'dalvik/system/PathClassLoader' org/jetbrains/kotlin/util/ServiceLoaderLite.class
          echo "Remapped class wiring verified."

      - name: Upload kotlinc jar
        uses: actions/upload-artifact@v4
        with:
          name: kotlinc-${{ github.sha }}
          path: build/libs/kotlinc.jar
          if-no-files-found: error
          retention-days: 14
