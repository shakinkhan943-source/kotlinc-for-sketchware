name: Kotlin Android Compiler CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - kotlin-2.4.10-android-modernization
  pull_request:
    branches:
      - master

concurrency:
  group: kotlinc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Kotlin compiler jar
        run: ./gradlew --no-daemon --stacktrace :kotlinc:shadowJar

      - name: Verify artifact
        run: |
          test -s build/libs/kotlinc.jar
          ls -lh build/libs/kotlinc.jar
          jar tf build/libs/kotlinc.jar | grep -q 'org/jetbrains/kotlin/cli/jvm/K2JVMCompiler.class'

      - name: Upload kotlinc jar
        uses: actions/upload-artifact@v4
        with:
          name: kotlinc-${{ github.sha }}
          path: build/libs/kotlinc.jar
          if-no-files-found: error
          retention-days: 14
